<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Translator · 英中双语阅读器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="left">
      <button id="backBtn" class="ghost hidden">← 书库</button>
      <span id="appTitle">📖 Book Translator</span>
      <span id="bookTitle" class="book-title"></span>
    </div>
    <div class="right">
      <button id="settingsBtn" class="ghost">⚙ 设置</button>
    </div>
  </header>

  <!-- 书库 -->
  <main id="libraryView">
    <section id="dropzone" class="dropzone">
      <div class="dz-inner">
        <div class="dz-icon">⬆</div>
        <p><b>拖入 PDF</b> 或点击选择文件</p>
        <p class="hint">支持整本英文书 PDF，上传后自动抽取文本</p>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>
    </section>
    <h2 class="sec-title">我的书库</h2>
    <div id="bookList" class="book-list"></div>
    <p id="emptyLib" class="empty hidden">还没有书，先上传一本 PDF 吧。</p>
  </main>

  <!-- 阅读器 -->
  <main id="readerView" class="hidden">
    <div id="readerToolbar" class="toolbar">
      <div class="nav">
        <button id="prevPage" class="ghost">‹ 上一页</button>
        <span class="page-ind">第 <input type="number" id="pageInput" min="1"> / <span id="totalPages">0</span> 页</span>
        <button id="nextPage" class="ghost">下一页 ›</button>
      </div>
      <div class="actions">
        <span id="transProgress" class="progress-text"></span>
        <button id="translateAllBtn" class="primary">翻译全书</button>
        <button id="translatePageBtn" class="ghost">译本页</button>
        <div class="dropdown">
          <button id="exportBtn" class="ghost">导出 ▾</button>
          <div class="menu" id="exportMenu">
            <a data-fmt="pdf">PDF（带目录）</a>
            <a data-fmt="html">双语 HTML</a>
            <a data-fmt="docx">Word 文档</a>
            <a data-fmt="md">Markdown</a>
          </div>
        </div>
      </div>
    </div>

    <div id="readerBody" class="reader-body">
      <div id="columns" class="columns">
        <div class="col-head en-head">英文原文</div>
        <div class="col-head zh-head">中文译文</div>
      </div>
      <div id="rows" class="rows"></div>

      <div class="notes">
        <div class="note-block">
          <h3>📝 AI 笔记</h3>
          <div id="aiNote" class="ai-note">尚未生成，翻译本页后自动产生。</div>
        </div>
        <div class="note-block">
          <h3>✍️ 我的笔记</h3>
          <textarea id="userNote" placeholder="在这里记下你的想法，自动保存…"></textarea>
        </div>
      </div>
    </div>
  </main>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <h2>设置</h2>
      <label>大模型服务商
        <select id="cfgProvider">
          <option value="deepseek">DeepSeek</option>
          <option value="custom">自定义 (OpenAI 兼容)</option>
        </select>
      </label>
      <label>API Key
        <input type="password" id="cfgApiKey" placeholder="sk-…（留空则保留已存的）">
        <span id="keyHint" class="hint"></span>
      </label>
      <label>接口地址 Base URL
        <input type="text" id="cfgBaseUrl" placeholder="https://api.deepseek.com">
      </label>
      <label>模型
        <input type="text" id="cfgModel" placeholder="deepseek-chat">
      </label>
      <div class="row2">
        <label>目标语言
          <input type="text" id="cfgTarget" value="中文">
        </label>
        <label>并发页数
          <input type="number" id="cfgConcurrency" min="1" max="8" value="4">
        </label>
      </div>
      <div class="row2">
        <label class="check"><input type="checkbox" id="cfgMakeNotes" checked> 生成 AI 笔记</label>
        <label>笔记风格
          <select id="cfgNoteStyle">
            <option>讲解版</option>
            <option>精简版</option>
            <option>学术版</option>
          </select>
        </label>
      </div>
      <label>扫描版 OCR
        <select id="cfgOcrMode">
          <option value="auto">自动（仅对无文字的扫描页识别）</option>
          <option value="off">关闭</option>
          <option value="force">强制（每页都 OCR，较慢）</option>
        </select>
        <span id="ocrHint" class="hint"></span>
      </label>
      <div id="testResult" class="test-result"></div>
      <div class="modal-actions">
        <button id="testBtn" class="ghost">测试连接</button>
        <span class="spacer"></span>
        <button id="cancelSettings" class="ghost">取消</button>
        <button id="saveSettings" class="primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
